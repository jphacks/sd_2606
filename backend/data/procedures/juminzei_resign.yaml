id: juminzei_resign
title: 退職後の住民税を納める
category: tax
summary: 会社を辞めた後の住民税は、届く納付書で自分で納めます。
deadline: 納付書の期限まで
office: 市区町村の役所（住民税の窓口）
relations:
  - {field: occupation, value: unemployed, flag: conditional, score: 0.7, reason: 会社を辞めると給与から引かれなくなるため}
  - {field: occupation, value: retired, flag: conditional, score: 0.5, reason: 退職した翌年も住民税を納めるため}
  - {field: occupation, op: in, value: [self_employed, freelance], flag: conditional, score: 0.4, reason: 独立すると自分で納めるため}
  - {field: occupation, value: student, flag: conditional, score: -0.3}   # 会社を辞めた学生は少ない
  - {field: occupation, value: employee, flag: unrelated, score: -1.0, reason: 給与から引かれているため}
steps:
  - title: 前の勤務先に残りの住民税の扱いを聞く
    detail: 1〜5月に辞めたら、最後の給与からまとめて引かれることが多いです。
    where: 前の勤務先
  - title: 届いた納付書で納める
    detail: 年4回（6・8・10・翌1月）に分けて納めます。
    documents: [住民税の納付書（市区町村から届く）]
  - title: 払えなければ役所に相談する
    detail: 減免や分割に応じる市区町村があります。
    where: 市区町村の役所
    when:
      - {field: occupation, op: in, value: [unemployed, part_time, student]}
links: []
