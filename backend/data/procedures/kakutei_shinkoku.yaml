id: kakutei_shinkoku
title: 確定申告をする
category: tax
summary: アルバイトの掛け持ちや年の途中で辞めた人は、確定申告で引かれすぎた税金が戻ることがあります。
deadline: 翌年2月16日〜3月15日（還付だけなら5年以内）
due: {month: 3, day: 15}
office: 税務署（e-Tax で自宅から出せる）
relations:
  - {field: part_time, value: "yes", flag: conditional, score: 0.4, reason: "アルバイト {part_time}"}
  - {field: annual_income, op: gt, value: 1780000, flag: conditional, score: 0.3, reason: "年収 {annual_income}（178万円超。あなたに所得税がかかる）"}
  # 掛け持ち（国税庁 No.1900）: 2か所以上から給与をもらい、年末調整を受けない方の給与（＋給与以外の所得）が20万円を超えると申告が要る。
  # ただし所得税がかからない年収（2026年分は178万円以下）なら納める税金がなく、申告は義務にならない（引かれすぎた分は還付申告で戻る）。
  # 質問は最初の画面では聞かず、カードの中で when の順に1つずつ聞く（年収が178万円以下と分かっていれば聞かない）
  - field: part_time
    value: "yes"
    flag: conditional
    score: 0.5
    reason: "年収 {annual_income}（178万円超）で掛け持ちし、年末調整を受けない方の給与が20万円を超えるため（申告が義務）"
    when:
      - {field: annual_income, op: gt, value: 1780000}
      - {field: multiple_jobs, value: "yes"}
      - {field: side_job_over_200k, value: "yes"}
  - {field: multiple_jobs, value: "yes", flag: conditional, score: 0.3, reason: 掛け持ちだと、年末調整を受けない方の給与から所得税が多めに引かれ、確定申告で戻ることがあるため}
  # バイト先が1か所で、年末に在籍して年末調整を受けるなら、所得税はそこで精算されるので確定申告は要らない（国税庁 No.1900）
  - field: multiple_jobs
    value: "no"
    flag: unrelated
    score: -1.0
    reason: バイト先が1か所で、年末調整で所得税が精算されるため
    when:
      - {field: year_end_employed, value: "yes"}
  # 年の途中で辞めて年末調整を受けないと、引かれすぎた所得税は確定申告（還付申告）で戻る（国税庁 No.1910）
  - {field: year_end_employed, value: "no", flag: conditional, score: 0.5, reason: 年末にアルバイト先に在籍しないと年末調整がなく、引かれすぎた所得税が確定申告で戻ることがあるため}
  - {field: annual_income, value: 0, flag: conditional, score: -0.5}   # 収入がなければ、納める税金も戻る税金もない
  - {field: part_time, value: "no", flag: unrelated, score: -1.0, reason: "アルバイト {part_time}"}
steps:
  - title: 源泉徴収票を集める
    detail: 今年給与をもらったアルバイト先すべてからもらいます。
    documents: [源泉徴収票（給与をもらったアルバイト先すべて）]
  - title: 控除の証明書を集める
    detail: 国民年金を自分で納めた人は、その控除証明書も用意します。
    documents: [国民年金保険料の控除証明書（納めた人）]
  - title: 確定申告書を作る
    detail: 国税庁の「確定申告書等作成コーナー」で入力すると、税額が計算されます。
    details:
      - 「作成開始」を押し、収入の種類で「給与」を選びます
      - 源泉徴収票の数字を画面の欄に入れると、戻る税金が計算されます
      - 学生なら「勤労学生控除」も選びます
    where: 確定申告書等作成コーナー（Web）
  - title: e-Tax か税務署で提出する
    detail: マイナンバーカードがあればスマホから出せます。
    details:
      - スマホなら、マイナンバーカードを読み取って送信します
      - 印刷して郵送するか、税務署の窓口に出すこともできます
    where: e-Tax・税務署
    documents: [マイナンバーカード（ない場合はマイナンバーが分かる書類と本人確認書類の写し）]
  - title: 還付金の振込先を書く
    detail: 1か月半ほどで振り込まれます。
    documents: [還付金を受け取る本人名義の口座]
  - title: 3月15日までに納税する
    detail: 所得税がかかる人は、口座振替・クレジットカード・コンビニなどで納めます。
    when:
      - {field: annual_income, op: gt, value: 1780000}
reminders:
  - {label: 確定申告の期限, month: 3, day: 15}
amounts:
  - {kind: shotokuzei, card: true}
notes:
  - text: 年収163万円以下で、年末調整で勤労学生控除を受けていなければ、確定申告で受けられます。
    when:
      - {field: annual_income, op: lte, value: 1630000}
  - text: 自分で納めた国民年金・国民健康保険の保険料は、社会保険料控除になります。控除証明書を用意して申告書に書きます。
links:
  - {label: 国税庁 確定申告書等作成コーナー, url: "https://www.keisan.nta.go.jp/"}
  - {label: 国税庁 No.1900 給与所得者で確定申告が必要な人, url: "https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1900.htm"}
  - {label: 国税庁 No.2030 還付申告, url: "https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2030.htm"}
