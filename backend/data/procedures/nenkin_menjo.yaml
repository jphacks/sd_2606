id: nenkin_menjo
title: 国民年金保険料の免除・納付猶予
category: pension
summary: 国民年金の保険料を払えないとき、申請すると免除や納付猶予を受けられます。
deadline: 早めに（2年前までさかのぼれる）
office: 市区町村の役所・年金事務所・マイナポータル
relations:
  - {field: occupation, value: unemployed, flag: conditional, score: 0.7, reason: 無職・求職中である}
  - {field: annual_income, op: lt, value: 1000000, flag: conditional, score: 0.3, reason: 年収が100万円未満}
  - {field: occupation, op: in, value: [self_employed, freelance], flag: conditional, score: 0.2, reason: 自営業・フリーランスである}
  - {field: occupation, value: student, flag: unrelated, score: -1.0, reason: 学生である}
  - {field: occupation, value: employee, flag: unrelated, score: -1.0, reason: 会社員・公務員である}
  - {field: age, op: gte, value: 60, flag: unrelated, score: -1.0, reason: 60歳以上}
  - {field: age, op: lt, value: 20, flag: unrelated, score: -1.0, reason: 20歳未満}
steps:
  - title: 免除・納付猶予の申請書を用意する
    detail: 役所・年金事務所でもらうか、日本年金機構のサイトから印刷します。
    documents: [国民年金保険料免除・納付猶予申請書, 基礎年金番号が分かるもの]
  - title: 同じ申請書で納付猶予も申し込む
    detail: 免除が通らなくても、猶予を受けられることがあります。
    when:
      - {field: age, op: lt, value: 50}
  - title: 離職票などのコピーを付ける
    detail: 失業の特例で、前の年の収入にかかわらず審査されます。
    documents: [雇用保険被保険者離職票などのコピー]
    when:
      - {field: occupation, value: unemployed}
  - title: 役所か年金事務所に出す
    detail: 窓口・郵送・マイナポータルのどれかで出します。
    details:
      - マイナポータルの電子申請（国民年金保険料の免除・納付猶予）でも出せます
      - 郵送するときは、住所地を担当する年金事務所に送ります
    where: 市区町村の役所・年金事務所・マイナポータル
  - title: 毎年7月に申請し直す
    detail: 承認は1年ごと（7月〜翌年6月）です。
  - title: （任意）10年以内に追納する
    detail: 余裕ができたら、免除・猶予の分を納められます。
reminders:
  - {label: 免除・納付猶予の申請し直し（7月から新しい年度）, month: 7, day: 31}
links:
  - {label: 日本年金機構 国民年金保険料の免除制度・納付猶予制度, url: "https://www.nenkin.go.jp/service/kokunen/menjo/20150428.html"}
  - {label: 日本年金機構 転職をご検討中の方へ（加入・免除のご案内）, url: "https://www.nenkin.go.jp/tokusetsu/taishoku_menjo.html"}
