id: kaigyo_todoke
title: 開業届を出す
category: registration
summary: 個人で事業を始めたら、税務署に開業届を出します。
deadline: 開業から1か月以内（青色申告の申請は2か月以内）
due: {days: 30}
office: 税務署（e-Tax で出せる）
relations:
  - {field: occupation, op: in, value: [self_employed, freelance], flag: required, score: 0.8, reason: 自営業・フリーランスである（まだ出していなければ）}
  - {field: occupation, op: not_in, value: [self_employed, freelance], flag: unrelated, score: -1.0, reason: 自営業・フリーランスではない}
steps:
  - title: 勤務先の副業の決まりを確かめる
    detail: 就業規則で副業が認められているか確かめます。
    when:
      - {field: occupation, value: employee}
  - title: 開業届を作る
    detail: 国税庁の作成コーナーで作れます。
    details:
      - 用紙は国税庁のサイトから印刷できます（税務署でももらえます）
      - 職業・屋号（なくてもよい）・開業日・事業の内容を書きます
      - e-Tax でも作って出せます
    documents: [個人事業の開業・廃業等届出書, マイナンバーカード（ない場合はマイナンバーが分かる書類と本人確認書類）]
  - title: 青色申告承認申請書も作る
    detail: 出すと、所得から最大65万円を差し引けます。
    details:
      - 開業日から2か月以内に出します（1月1〜15日に開業したなら3月15日まで）
    documents: [所得税の青色申告承認申請書]
  - title: 税務署に出す
    detail: e-Tax・郵送・持参のどれかで出し、控えを保管します。
    where: e-Tax・税務署
links:
  - {label: 国税庁 個人事業の開業届出, url: "https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/04.htm"}
