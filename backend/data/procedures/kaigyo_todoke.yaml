id: kaigyo_todoke
title: 開業届と青色申告承認申請
category: registration
summary: 個人で事業を始めたら税務署に開業届を出します。同時に青色申告の承認申請をすると最大65万円の控除が受けられます。
priority: 88
deadline: 開業届は開業日から1か月以内。青色申告承認申請は開業日から2か月以内
office: 住所地の税務署（e-Tax で提出可能）
match:
  - reason: 開業・独立したため
    when:
      - {field: life_events, op: contains, value: start_business}
  - reason: 継続して事業をしているなら開業届が必要なため（未提出の場合）
    when:
      - {field: occupation, op: in, value: [self_employed, freelance]}
steps:
  - title: 開業届（個人事業の開業・廃業等届出書）を作る
    detail: 屋号・事業内容・開業日を記入します。国税庁の作成コーナーなど無料ツールでも作れます。
    documents: [マイナンバーカード]
  - title: 青色申告承認申請書も一緒に作る
    detail: 帳簿を複式簿記でつけ e-Tax で申告すると、所得から最大65万円を差し引けます。
  - title: 税務署に提出する
    detail: e-Tax・郵送・持参のいずれか。控えをもらっておくと、口座開設や融資の際に使えます。
    where: e-Tax・税務署
links:
  - {label: 国税庁 個人事業の開業届出, url: "https://www.nta.go.jp/taxes/tetsuzuki/shinsei/annai/shinkoku/annai/04.htm"}
