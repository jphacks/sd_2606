id: fuyou_hazureru
title: 親の扶養から外れる
category: insurance
summary: アルバイトの年収が基準を超えたとき、親が勤務先に届け出て、自分は国保に入ります。
deadline: 外れた日から5日以内（親の勤務先を通じて）。税金は親の年末調整まで
due: {days: 5}
office: 親の勤務先
relations:
  # 健康保険: 19〜22歳は150万円以上、それ以外は130万円以上。税金: 136万円を超えると親の控除の申告が変わる
  - field: annual_income
    op: gte
    value: 1500000
    flag: conditional
    score: 0.8
    reason: "年収 {annual_income}（150万円以上）、年末の年齢 {age_at_year_end}（19〜22歳）"
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.8
    reason: "年収 {annual_income}（130万円以上）、年末の年齢 {age_at_year_end}（19〜22歳以外）"
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
  - field: annual_income
    op: gt
    value: 1360000
    flag: conditional
    score: 0.5
    reason: "年収 {annual_income}（136万円超）、年末の年齢 {age_at_year_end}（19〜22歳）"
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
  - {field: part_time, value: "yes", flag: conditional, score: 0.3, reason: "アルバイト {part_time}"}
  - {field: supported_by, value: none, flag: unrelated, score: -1.0, reason: "{supported_by}"}
  - field: annual_income
    op: lte
    value: 1360000
    flag: unrelated
    score: -1.0
    reason: "年収 {annual_income}（136万円以下）、年末の年齢 {age_at_year_end}（19〜22歳）"
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
  - field: annual_income
    op: lt
    value: 1300000
    flag: unrelated
    score: -1.0
    reason: "年収 {annual_income}（130万円未満）、年末の年齢 {age_at_year_end}（19〜22歳以外）"
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
steps:
  # 健康保険: 年収が基準以上のとき（年齢で基準が違うので、条件の違う同じステップを並べる）
  - title: 親に「被扶養者（異動）届」を出してもらう
    detail: 親の勤務先に5日以内に出します。親の保険の資格確認書を持っていれば返します。
    details:
      - 外れた日と理由（収入が基準を超えた）を親に伝えます
      - 親が勤務先に伝えると、届出書を用意してもらえます
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 親に「被扶養者（異動）届」を出してもらう
    detail: 親の勤務先に5日以内に出します。親の保険の資格確認書を持っていれば返します。
    details:
      - 外れた日と理由（収入が基準を超えた）を親に伝えます
      - 親が勤務先に伝えると、届出書を用意してもらえます
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  - title: 自分で国保に入る
    detail: 役所で14日以内に届け出ます（「国民健康保険に入る」）。
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 自分で国保に入る
    detail: 役所で14日以内に届け出ます（「国民健康保険に入る」）。
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  # 税金: 親の年末調整
  - title: 親に年収を伝え、特定親族特別控除に切り替えてもらう
    detail: 親が勤務先の年末調整で「特定親族特別控除申告書」を出します。
    details:
      - 1〜12月の給与の合計（交通費を除く）を伝えます
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先に出している扶養控除等申告書から、名前を消してもらいます。
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先に出している扶養控除等申告書から、名前を消してもらいます。
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
amounts:
  - {kind: parent_deduction, card: true}
notes:
  - text: 年収197万円以下なら、税金では親は特定親族特別控除を受けられます（159万円までは63万円）。親の年末調整で申告してもらいましょう。
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 1970000}
  - text: 国民健康保険に入ったら、自分で納めた保険料は社会保険料控除になります。
links:
