id: fuyou_hazureru
title: 親の扶養から外れる（親の勤務先への届出）
category: insurance
summary: 就職して自分の勤務先の健康保険に入ったときや、アルバイトの収入が基準を超えたときは、親の健康保険と税金の扶養から外れます。届け出るのは親（親の勤務先）なので、本人から親に伝えます。
deadline: 健康保険は扶養から外れた日から5日以内（親の勤務先を通じて）。税金は親の年末調整まで
due: {days: 5}
office: 親の勤務先
relations:
  - field: occupation
    value: employee
    flag: conditional
    score: 0.9
    reason: 就職して自分の勤務先の健康保険に入ると、親の扶養から外れるため
    when:
      - {field: supported_by, value: parent}
  - field: annual_income
    op: gte
    value: 1500000
    flag: conditional
    score: 0.6
    reason: 19〜22歳で年収が150万円以上だと、親の健康保険の扶養から外れるため
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}   # 会社員は上の行で判定する
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.6
    reason: 年収が130万円以上だと、親の健康保険の扶養から外れるため
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - {field: occupation, op: in, value: [part_time, student], flag: conditional, score: 0.3, reason: アルバイトの収入が基準を超えると、親の扶養から外れるため}
  - {field: age, op: lt, value: 26, flag: conditional, score: 0.2, reason: 20代前半までは、親の扶養に入っている人が多いため}
  - {field: age, op: gte, value: 30, flag: conditional, score: -0.8}   # 親の扶養に入っている人は少ない
  - {field: supported_by, op: in, value: [spouse, none], flag: unrelated, score: -1.0, reason: 親の扶養に入っていないため}
steps:
  - title: 外れる日を確かめる（就職した場合）
    detail: 自分の勤務先の健康保険に入った日（ふつうは入社日）に、親の健康保険の扶養から外れます。
    when:
      - {field: occupation, value: employee}
  - title: 外れる日を確かめる（アルバイトの収入が増えた場合）
    detail: これから1年間の収入（交通費を含む）の見込みが150万円以上になった時点で、親の健康保険の扶養から外れます（19〜22歳の基準）。
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
  - title: 外れる日を確かめる（アルバイトの収入が増えた場合）
    detail: これから1年間の収入（交通費を含む）の見込みが130万円以上になった時点で、親の健康保険の扶養から外れます。
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
  - title: 親に伝える
    detail: 届け出るのは親です。外れる日と理由（就職・収入の増加）を伝えます。
  - title: 親が勤務先に「被扶養者（異動）届」を出す
    detail: 親の勤務先を通じて、健康保険の扶養から外す届出をします。扶養から外れた日から5日以内です。親の健康保険の資格確認書などを持っていれば返します。
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
  - title: 親の年末調整で扶養控除の申告を直す（19〜22歳）
    detail: 2026年の給与収入が136万円以下なら、親は特定扶養控除（63万円）を受けられます。136万円を超えても197万円以下なら、特定親族特別控除に変わります（159万円以下なら満額）。親が勤務先に「扶養控除等（異動）申告書」を出し直します。
    where: 親の勤務先
    documents: [給与所得者の扶養控除等（異動）申告書]
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
  - title: 親の年末調整で扶養控除の申告を直す
    detail: 2026年の給与収入が136万円を超えると、親の扶養控除の対象から外れます。親が勤務先に「扶養控除等（異動）申告書」を出し直します。
    where: 親の勤務先
    documents: [給与所得者の扶養控除等（異動）申告書]
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
  - title: 届け出が遅れたら
    detail: 扶養から外れた後に親の健康保険で受診した医療費は、返すよう求められることがあります。気づいたらすぐに届け出ます。
