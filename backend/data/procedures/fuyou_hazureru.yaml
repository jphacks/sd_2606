id: fuyou_hazureru
title: 親の扶養から外れる
category: insurance
summary: 就職したときや収入が基準を超えたとき、親が勤務先に届け出ます。
deadline: 外れた日から5日以内（親の勤務先を通じて）。税金は親の年末調整まで
due: {days: 5}
office: 親の勤務先
relations:
  - field: occupation
    value: employee
    flag: conditional
    score: 0.9
    reason: 就職して自分の健康保険に入ったため
    when:
      - {field: supported_by, value: parent}
  - field: annual_income
    op: gte
    value: 1500000
    flag: conditional
    score: 0.6
    reason: 年収が150万円以上のため
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}   # 会社員は上の行で判定する
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.6
    reason: 年収が130万円以上のため
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - field: annual_income
    op: gt
    value: 1360000
    flag: conditional
    score: 0.5
    reason: 年収が136万円を超え、親の税金の控除が変わるため
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - {field: occupation, op: in, value: [part_time, student], flag: conditional, score: 0.3, reason: アルバイトの収入が増えると外れることがあるため}
  - {field: age, op: lt, value: 26, flag: conditional, score: 0.2, reason: 親の扶養に入っていることが多い年代のため}
  - {field: age, op: gte, value: 30, flag: conditional, score: -0.8}   # 親の扶養に入っている人は少ない
  - {field: supported_by, op: in, value: [spouse, none], flag: unrelated, score: -1.0, reason: 親の扶養に入っていないため}
  - field: annual_income
    op: lte
    value: 1360000
    flag: unrelated
    score: -1.0
    reason: 年収が136万円以下で、扶養のままでいられるため
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - field: annual_income
    op: lt
    value: 1300000
    flag: unrelated
    score: -1.0
    reason: 年収が130万円未満で、扶養のままでいられるため
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
steps:
  - title: 入社日を親に伝える
    detail: 自分の健康保険に入った日に、親の扶養から外れます。
    when:
      - {field: occupation, value: employee}
  # 健康保険: 会社員はいつも、ほかは年収が基準以上のとき（条件の違う同じステップを並べる）
  - title: 親に「被扶養者（異動）届」を出してもらう
    detail: 親の勤務先に5日以内に出します。親の保険の資格確認書を持っていれば返します。
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
    when:
      - {field: occupation, value: employee}
  - title: 親に「被扶養者（異動）届」を出してもらう
    detail: 親の勤務先に5日以内に出します。親の保険の資格確認書を持っていれば返します。
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 親に「被扶養者（異動）届」を出してもらう
    detail: 親の勤務先に5日以内に出します。親の保険の資格確認書を持っていれば返します。
    where: 親の勤務先
    documents: [健康保険 被扶養者（異動）届（親の勤務先が用意）]
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  - title: 自分で国保に入る
    detail: 役所で14日以内に届け出ます（「国民健康保険に入る」）。
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 自分で国保に入る
    detail: 役所で14日以内に届け出ます（「国民健康保険に入る」）。
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  # 税金: 親の年末調整
  - title: 親に年収を伝え、特定親族特別控除に切り替えてもらう
    detail: 親が勤務先の年末調整で申告します。
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先の年末調整で申告します。
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先の年末調整で申告します。
    where: 親の勤務先
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
