id: gakusei_tokurei
title: 国民年金の学生納付特例
category: pension
summary: 20歳以上の学生は、申請すると在学中の国民年金保険料の納付が猶予されます。
priority: 85
deadline: 毎年度（4月〜翌3月）申請。過去2年1か月分までさかのぼって申請可能
office: 市区町村役所・年金事務所・在学中の学校（代行している場合）・マイナポータル
match:
  - reason: 20歳以上の学生で、保険料の納付を猶予できるため
    when:
      - {field: occupation, op: eq, value: student}
      - {field: age, op: gte, value: 20}
steps:
  - title: 学生証（在学証明書）を用意する
    detail: 学生証のコピー、または在学証明書を用意します。
    documents: [学生証のコピーまたは在学証明書, 基礎年金番号が分かるもの]
  - title: 申請する
    detail: マイナポータルから電子申請するか、役所・年金事務所に申請書を出します。
    where: マイナポータル・市区町村役所
  - title: 承認通知を受け取る
    detail: 承認されると通知が届きます。毎年度の申請が必要です（継続の案内が届く場合あり）。
  - title: 10年以内に追納する（任意）
    detail: 猶予された期間の保険料は10年以内なら後から納められ、満額の年金に近づけられます。
links:
  - {label: 日本年金機構 学生納付特例制度, url: "https://www.nenkin.go.jp/service/kokunen/menjo/20150514.html"}
