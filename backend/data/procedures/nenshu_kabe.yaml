id: nenshu_kabe
title: 年収の壁（家族の扶養に入って働く）
category: tax
summary: 家族の扶養に入って働く人は、年収で家族の税金と健康保険が変わります。
deadline: 年末調整（11〜12月）の前
due: {month: 11, day: 30}
office: 家族の勤務先（年末調整・健康保険の届出）
relations:
  # 年収が基準を超えて家族が届け出るときだけ必須にする。基準より低ければ「関係がありそう」
  - field: annual_income
    op: gt
    value: 1360000
    flag: conditional
    score: 0.7
    reason: 年収が136万円を超え、家族の税金の控除が変わるため
    when:
      - {field: supported_by, op: in, value: [parent, spouse]}
      - {field: occupation, op: ne, value: employee}   # 会社員は「親の扶養から外れる」で扱う
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.7
    reason: 年収が130万円以上で、家族の健康保険の扶養から外れるため
    when:
      - {field: supported_by, op: in, value: [parent, spouse]}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.7
    reason: 年収が130万円以上で、配偶者の健康保険の扶養から外れるため
    when:
      - {field: supported_by, value: spouse}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: occupation, op: ne, value: employee}
  - {field: occupation, value: part_time, flag: conditional, score: 0.5, reason: アルバイト・パートの年収で家族の扶養が変わるため}
  - {field: occupation, value: student, flag: conditional, score: 0.4, reason: アルバイトの年収で親の扶養が変わるため}
  - {field: supported_by, op: in, value: [parent, spouse], flag: conditional, score: 0.3, reason: 家族の扶養に入っているため}
  - {field: annual_income, op: gte, value: 1000000, flag: conditional, score: 0.3, reason: 年収が扶養の基準に近いため}
  - {field: annual_income, op: lt, value: 500000, flag: conditional, score: -0.3}   # 基準から遠い
  - {field: supported_by, value: none, flag: unrelated, score: -1.0, reason: 家族の扶養に入っていないため}
  - {field: occupation, value: employee, flag: unrelated, score: -1.0, reason: 自分の勤務先の健康保険に入っているため}
steps:
  - title: 扶養に入っているか家族に確かめる
    detail: 健康保険は保険証（資格確認書）で、税金は家族の年末調整の書類で分かります。
    when:
      - {field: supported_by, value: unknown}
  - title: 給与明細で年収を確かめる
    detail: 1〜12月の合計で、掛け持ちなら合算します。
    details:
      - 税金は交通費を除いて、健康保険は交通費を含めて数えます
      - 掛け持ちしているなら、すべてのアルバイト先の分を足します
    documents: [給与明細]
  # 税金: 親・配偶者の年末調整
  - title: 親に年収を伝え、特定親族特別控除に切り替えてもらう
    detail: 親が勤務先の年末調整で申告します。
    details:
      - 1〜12月の給与の合計（交通費を除く）を伝えます
      - 親が年末調整で「特定親族特別控除申告書」に書いて出します
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先の年末調整で申告します。
    details:
      - 1〜12月の給与の合計（交通費を除く）を伝えます
      - 親が勤務先に出している扶養控除等申告書から、子の名前を消してもらいます
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先の年末調整で申告します。
    details:
      - 1〜12月の給与の合計（交通費を除く）を伝えます
      - 親が勤務先に出している扶養控除等申告書から、子の名前を消してもらいます
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
  - title: 配偶者に年収を伝え、配偶者特別控除に切り替えてもらう
    detail: 配偶者が勤務先の年末調整で申告します。
    where: 配偶者の勤務先
    when:
      - {field: supported_by, value: spouse}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 2070000}
  - title: 配偶者に年収を伝え、控除の申告を外してもらう
    detail: 配偶者が勤務先の年末調整で申告します。
    where: 配偶者の勤務先
    when:
      - {field: supported_by, value: spouse}
      - {field: annual_income, op: gt, value: 2070000}
  # 健康保険: 家族の勤務先への届出
  - title: 家族の健康保険の扶養から外れる届出をしてもらう
    detail: 家族が勤務先に届け出て、自分は国保などに入ります（「親の扶養から外れる」）。
    where: 家族の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: supported_by, op: ne, value: spouse}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 家族の健康保険の扶養から外れる届出をしてもらう
    detail: 家族が勤務先に届け出て、自分は国保などに入ります（「親の扶養から外れる」）。
    where: 家族の勤務先
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  - title: 配偶者の健康保険の扶養から外れる届出をしてもらう
    detail: 配偶者が勤務先に届け出て、自分は国保などに入ります。
    where: 配偶者の勤務先
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: supported_by, value: spouse}
      - {field: annual_income, op: gte, value: 1300000}
  # まだ基準を超えていない人: 次の基準を超えそうなら伝える
  - title: 年収が136万円を超えそうなら家族に伝える
    detail: 136万円を超えると親の税金の控除が、150万円以上で健康保険の扶養が変わります。
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: supported_by, op: ne, value: spouse}
      - {field: annual_income, op: lte, value: 1360000}
  - title: 年収が150万円を超えそうなら家族に伝える
    detail: 150万円以上で、親の健康保険の扶養から外れます。
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: supported_by, op: ne, value: spouse}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lt, value: 1500000}
  - title: 年収が130万円を超えそうなら家族に伝える
    detail: 130万円以上で健康保険の扶養から、136万円を超えると税金の扶養から外れます。
    when:
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: lt, value: 1300000}
  - title: 年収が130万円を超えそうなら家族に伝える
    detail: 130万円以上で健康保険の扶養から、136万円を超えると税金の扶養から外れます。
    when:
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: supported_by, value: spouse}
      - {field: annual_income, op: lt, value: 1300000}
