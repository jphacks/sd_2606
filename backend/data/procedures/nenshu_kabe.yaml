id: nenshu_kabe
title: 年収の壁（アルバイトの年収）
category: tax
summary: アルバイトの年収で、自分の住民税・所得税と、親の税金・健康保険の扶養が変わります。
deadline: 年末調整（11〜12月）の前
due: {month: 11, day: 30}
office: 親の勤務先（年末調整・健康保険の届出）・アルバイト先
relations:
  # 親が届け出ることになる年収（税金は136万円超、健康保険は19〜22歳150万円・それ以外130万円以上）なら必須
  - field: annual_income
    op: gt
    value: 1360000
    flag: conditional
    score: 0.7
    reason: "年収 {annual_income}（136万円超）、{supported_by}"
    when:
      - {field: supported_by, value: parent}
  - field: annual_income
    op: gte
    value: 1300000
    flag: conditional
    score: 0.7
    reason: "年収 {annual_income}（130万円以上）、年末の年齢 {age_at_year_end}（19〜22歳以外）"
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
  - {field: part_time, value: "yes", flag: conditional, score: 0.5, reason: "アルバイト {part_time}"}
  - {field: supported_by, value: parent, flag: conditional, score: 0.3, reason: "{supported_by}"}
  - {field: annual_income, op: gte, value: 1000000, flag: conditional, score: 0.3, reason: "年収 {annual_income}（100万円以上）"}
  - {field: annual_income, op: gt, value: 1190000, flag: conditional, score: 0.2, reason: "年収 {annual_income}（119万円超。あなたに住民税がかかる）"}
  - {field: annual_income, op: gt, value: 1780000, flag: conditional, score: 0.2, reason: "年収 {annual_income}（178万円超。あなたに所得税がかかる）"}
  - {field: annual_income, op: lt, value: 500000, flag: conditional, score: -0.3}   # 基準から遠い
  - field: part_time
    value: "no"
    flag: unrelated
    score: -1.0
    reason: "アルバイト {part_time}、年収 {annual_income}"
    when:
      - {field: annual_income, op: lt, value: 1000000}
steps:
  - title: 扶養に入っているか親に確かめる
    detail: 健康保険は保険証（資格確認書）で、税金は親の年末調整の書類で分かります。
    when:
      - {field: supported_by, value: unknown}
  - title: 給与明細で年収を確かめる
    detail: 1〜12月の合計で、掛け持ちなら合算します。
    details:
      - 税金は交通費を除いて、健康保険は交通費を含めて数えます
      - 掛け持ちしているなら、すべてのアルバイト先の分を足します
    documents: [給与明細]
  # 税金: 親の年末調整
  - title: 親に年収を伝え、特定親族特別控除に切り替えてもらう
    detail: 親が勤務先の年末調整で「特定親族特別控除申告書」を出します。
    details:
      - 1〜12月の給与の合計（交通費を除く）を伝えます
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lte, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先に出している扶養控除等申告書から、名前を消してもらいます。
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1970000}
  - title: 親に年収を伝え、扶養控除の申告を外してもらう
    detail: 親が勤務先に出している扶養控除等申告書から、名前を消してもらいます。
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
  # 健康保険: 親の勤務先への届出
  - title: 親の健康保険の扶養から外れる届出をしてもらう
    detail: 親が勤務先に届け出て、自分は国保に入ります（「親の扶養から外れる」）。
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1500000}
  - title: 親の健康保険の扶養から外れる届出をしてもらう
    detail: 親が勤務先に届け出て、自分は国保に入ります（「親の扶養から外れる」）。
    where: 親の勤務先
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gte, value: 1300000}
  # 自分の税金
  - title: アルバイト先に「勤労学生」を申告する
    detail: 扶養控除等申告書の勤労学生の欄に印を付けると、住民税が安くなります。
    where: アルバイト先
    documents: [給与所得者の扶養控除等（異動）申告書]
    when:
      - {field: annual_income, op: gt, value: 1190000}
      - {field: annual_income, op: lte, value: 1630000}
  - title: 来年6月から住民税を納める
    detail: 給与から引かれないときは、市区町村から納付書が届きます。
    when:
      - {field: annual_income, op: gt, value: 1190000}
  # まだ基準を超えていない人: 次の基準を超えそうなら伝える
  - title: 年収が136万円を超えそうなら親に伝える
    detail: 136万円を超えると親の税金の控除が、150万円以上で健康保険の扶養が変わります。
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: lte, value: 1360000}
  - title: 年収が150万円を超えそうなら親に伝える
    detail: 150万円以上で、親の健康保険の扶養から外れます。
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: gt, value: 1360000}
      - {field: annual_income, op: lt, value: 1500000}
  - title: 年収が130万円を超えそうなら親に伝える
    detail: 130万円以上で健康保険の扶養から、136万円を超えると税金の扶養から外れます。
    when:
      - {field: supported_by, value: parent}
      - {field: age_at_year_end, op: not_in, value: [19, 20, 21, 22]}
      - {field: annual_income, op: lt, value: 1300000}
reminders:
  - {label: 年収を確かめて親に伝える（年末調整の前）, month: 11, day: 30}
amounts:
  - kind: parent_deduction   # 親の扶養に入っている人には、親の控除がいちばん大きい
    card: true
    when:
      - {field: supported_by, value: parent}
  - {kind: juminzei, card: true}
  - kind: shotokuzei
    when:
      - {field: annual_income, op: gt, value: 1600000}   # 所得税がかかる178万円に近い人だけ
links:
  - {label: 国税庁 源泉所得税の改正のあらまし（令和8年4月）, url: "https://www.nta.go.jp/publication/pamph/gensen/2026kaisei.pdf"}
  - {label: 日本年金機構 19歳以上23歳未満の方の被扶養者認定の年間収入要件, url: "https://www.nenkin.go.jp/oshirase/taisetu/2025/202508/0819.html"}
  - {label: 国税庁 No.1175 勤労学生控除, url: "https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1175.htm"}
