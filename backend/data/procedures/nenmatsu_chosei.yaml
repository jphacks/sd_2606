id: nenmatsu_chosei
title: 年末調整の書類を出す
category: tax
summary: アルバイト先が12月に1年分の所得税を精算します。そのための書類をアルバイト先に出します。
deadline: 11〜12月ごろ（アルバイト先が指定する日）
due: {month: 11, day: 30}
office: アルバイト先
relations:
  - {field: part_time, value: "yes", flag: conditional, score: 0.7, reason: "アルバイト {part_time}"}
  - {field: part_time, value: "no", flag: unrelated, score: -1.0, reason: "アルバイト {part_time}"}
steps:
  - title: 扶養控除等申告書を出す
    detail: 働き始めたら、最初の給与の前にアルバイト先に出します。
    details:
      - アルバイト先から渡される用紙（電子の場合はアプリ）に、住所・マイナンバーを書きます
      - 学生なら「勤労学生」の欄に印を付けます（住民税が安くなることがあります）
    where: アルバイト先
    documents: [給与所得者の扶養控除等（異動）申告書]
  - title: 掛け持ちなら、申告書は主なアルバイト先1か所だけに出す
    detail: ほかのアルバイト先では税金が多めに引かれ、確定申告で戻ります。
  - title: 11〜12月に年末調整の書類を出す
    detail: 国民年金を自分で納めた人は、控除証明書も付けます。
    details:
      - 基礎控除申告書には、今年の給与の合計額を書きます
      - 国民年金を自分で納めた人は、11月ごろ届く控除証明書を付けます
    where: アルバイト先
    documents: [基礎控除申告書, 国民年金保険料の控除証明書（納めた人）]
  - title: 源泉徴収票を受け取って保管する
    detail: 年明けに渡されます。確定申告や就職のときに使います。
reminders:
  - {label: 年末調整の書類（アルバイト先の締め切りも確認）, month: 11, day: 30}
amounts:
  - {kind: shotokuzei, card: true}
links:
