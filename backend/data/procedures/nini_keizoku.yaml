id: nini_keizoku
title: 健康保険の任意継続
category: insurance
summary: 退職後も、前の勤務先の健康保険に最長2年入り続けられます。
deadline: 退職日の翌日から20日以内
due: {days: 20}
office: 前の勤務先の健康保険（協会けんぽの支部・健康保険組合）
relations:
  - {field: occupation, value: unemployed, flag: conditional, score: 0.6, reason: 会社を辞めて20日以内なら選べるため}
  - {field: occupation, value: retired, flag: conditional, score: 0.4, reason: 退職したときに選べるため}
  - {field: occupation, op: in, value: [self_employed, freelance], flag: conditional, score: 0.3, reason: 独立したときに国保と比べて選べるため}
  - {field: occupation, value: employee, flag: unrelated, score: -1.0, reason: 勤務先の健康保険に入っているため}
  - {field: health_insurance, op: in, value: [national, dependent], flag: unrelated, score: -1.0, reason: すでに国保か家族の扶養に入っているため}
  - {field: age, op: gte, value: 75, flag: unrelated, score: -1.0, reason: 75歳からは後期高齢者医療制度に入るため}
steps:
  - title: 加入できるか確かめる
    detail: 退職日まで2か月以上、勤務先の健康保険に入っていれば入れます。
  - title: 国保・家族の扶養と保険料を比べる
    detail: 任意継続の保険料は、退職前のおよそ2倍です（上限あり）。
    where: 前の勤務先の健康保険・市区町村の役所
  - title: 20日以内に申出書を出す
    detail: 協会けんぽの支部か健康保険組合に、郵送などで出します。
    details:
      - 協会けんぽは、サイトから申出書を印刷するか、支部から取り寄せます
      - 住所地の協会けんぽの支部に、退職日の翌日から20日以内に届くよう郵送します
      - 健康保険組合なら、その組合の案内に従います
    documents: [任意継続被保険者資格取得申出書]
  - title: 毎月10日までに保険料を納める
    detail: 遅れると資格を失います。
reminders:
  - {label: 任意継続の保険料の納付期限（毎月10日）, day: 10}
links:
  - {label: 協会けんぽ 任意継続, url: "https://www.kyoukaikenpo.or.jp/benefit/voluntary_continuation/index.html"}
