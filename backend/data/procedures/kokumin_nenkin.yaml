id: kokumin_nenkin
title: 国民年金の手続き
category: pension
summary: 厚生年金に入っていない人が入る年金です。保険料を納めるか、免除・猶予を申請します。
deadline: 会社を辞めたら14日以内に切り替え
due: {days: 14}
office: 市区町村の役所（国民年金の窓口）
relations:
  - field: age_at_year_end
    value: 20
    flag: conditional
    score: 1.0
    reason: 今年20歳になるため
    when:
      - {field: occupation, op: ne, value: employee}
  - field: occupation
    op: in
    value: [self_employed, freelance, unemployed, retired]
    flag: conditional
    score: 0.8
    reason: 自営業・フリーランス・無職は国民年金に入るため
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age, op: gte, value: 20}
      - {field: age, op: lt, value: 60}
  - field: occupation
    value: student
    flag: conditional
    score: 0.6
    reason: 20歳以上の学生も国民年金に入るため
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age, op: gte, value: 20}
      - {field: age, op: lt, value: 60}
  - {field: occupation, value: part_time, flag: conditional, score: 0.4, reason: 勤務先の厚生年金に入っていなければ国民年金に入るため}
  - {field: occupation, value: employee, flag: unrelated, score: -1.0, reason: 厚生年金に入っているため}
  - {field: age_at_year_end, op: lt, value: 20, flag: unrelated, score: -1.0, reason: 20歳になるまでは入らないため}
  - {field: age, op: gte, value: 60, flag: unrelated, score: -1.0, reason: 60歳からは入らないため}
steps:
  - title: 届いた「国民年金加入のお知らせ」を確かめる
    detail: 20歳の誕生日から約2週間で届きます。届出は要りません。
    documents: [国民年金加入のお知らせ, 基礎年金番号通知書]
    when:
      - {field: age_at_year_end, op: lte, value: 20}
  - title: 厚生年金からの切り替えを届け出る
    detail: 会社を辞めてから14日以内に、役所かマイナポータルで届け出ます。
    details:
      - 窓口では「国民年金被保険者関係届書（申出書）」に書きます
      - マイナポータルの電子申請でも届け出られます
      - 基礎年金番号かマイナンバーが分かるものを持っていきます
    where: 市区町村の役所・マイナポータル
    documents: [退職日が分かる書類（離職票・退職証明書など）, マイナンバーカード]
    when:
      - {field: occupation, op: in, value: [unemployed, self_employed, freelance, retired]}
      - {field: occupation, op: ne, value: employee}
      - {field: occupation, op: ne, value: student}
  - title: 学生納付特例を申請する
    detail: 在学中は保険料の納付を待ってもらえます（「国民年金の学生納付特例」）。
    when:
      - {field: occupation, value: student}
  - title: 保険料を納める
    detail: 納付書か口座振替で納めます。前納すると割引があります。
    details:
      - 納付書は、コンビニ・金融機関・スマホ決済アプリで使えます
      - 口座振替は「国民年金保険料口座振替納付（変更）申出書」を金融機関か年金事務所に出します
      - 6か月・1年・2年分をまとめて前納すると割引になります
    when:
      - {field: occupation, op: ne, value: student}
  - title: 払えなければ免除・納付猶予を申請する
    detail: 「国民年金保険料の免除・納付猶予」を参照。
    when:
      - {field: occupation, op: ne, value: student}
links:
  - {label: 日本年金機構 20歳到達時の国民年金の手続き, url: "https://www.nenkin.go.jp/service/kokunen/kanyu/hatachi-tetsuduki.html"}
  - {label: 日本年金機構 国民年金に加入するための手続き, url: "https://www.nenkin.go.jp/service/kokunen/kanyu/20140710-04.html"}
