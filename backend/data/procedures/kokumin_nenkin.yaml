id: kokumin_nenkin
title: 国民年金（第1号被保険者）の手続き
category: pension
summary: 20〜59歳で厚生年金に入っていない人は、国民年金の第1号被保険者として保険料を納めます。20歳になったときは届出は要らず、日本年金機構から書類が届きます。会社を辞めたときは、自分で切り替えを届け出ます。
deadline: 20歳になったときは届出不要（約2週間で書類が届く）。退職したときは14日以内に切り替えを届け出る
office: 住んでいる市区町村の役所（国民年金の窓口）
relations:
  - {field: life_events, value: turn_20, flag: required, score: 1.0, reason: 20歳になると国民年金に加入するため}
  - field: life_events
    value: resign
    flag: conditional
    score: 0.8
    reason: 退職して厚生年金から外れる20〜59歳は、国民年金に切り替えるため
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age, op: gte, value: 20}
      - {field: age, op: lt, value: 60}
  - field: occupation
    op: in
    value: [self_employed, freelance, unemployed]
    flag: conditional
    score: 0.5
    reason: 自営業・フリーランス・無職の20〜59歳は国民年金に加入するため（会社員を兼ねる場合は厚生年金）
    when:
      - {field: occupation, op: ne, value: employee}
      - {field: age, op: gte, value: 20}
      - {field: age, op: lt, value: 60}
  - {field: occupation, value: employee, flag: unrelated, score: -1.0}  # 厚生年金に入る
steps:
  - title: 20歳になったら、届いた書類を確かめる
    detail: 20歳になって約2週間で、日本年金機構から「国民年金加入のお知らせ」「基礎年金番号通知書」と、納付書・申請書が届きます。加入の届出は要りません。2週間たっても届かなければ、役所か年金事務所で手続きします。
    documents: [国民年金加入のお知らせ, 基礎年金番号通知書]
  - title: 保険料の納め方を選ぶ
    detail: 自分で納める（口座振替や前納なら割引あり）、学生なら学生納付特例を申請する、収入が少なければ免除・納付猶予を申請する、のどれかを選びます。家族が代わりに納めると、家族の税金の社会保険料控除になります。
  - title: 会社を辞めたら、切り替えを届け出る（14日以内）
    detail: 次の勤務先が決まっていない20〜59歳は、厚生年金から国民年金（第1号）への切り替えを届け出ます。マイナポータルからもできます。
    where: 市区町村の役所・マイナポータル
    documents: [退職日が分かる書類（離職票や退職証明書など）, マイナンバーカード]
  - title: 払えないときは放っておかない
    detail: 未納のままにすると、将来の年金だけでなく障害年金にも影響します。払えないときは免除・納付猶予を申請します。
