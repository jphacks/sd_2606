id: kokuho_withdraw
title: 就職したら国民健康保険をやめる
category: insurance
summary: 国保に入っていた人が勤務先の健康保険に入ったら、国保をやめる届出をします。
deadline: 勤務先の健康保険に入ってから14日以内
due: {days: 14}
office: 市区町村の役所（国民健康保険の窓口）
relations:
  - field: occupation
    value: employee
    flag: conditional
    score: 0.6
    reason: "働き方 会社員・公務員、就職前の健康保険 {prev_health_insurance}"
    when:
      - {field: prev_health_insurance, value: national}
  - {field: age, op: lt, value: 26, flag: conditional, score: 0.2, reason: "年齢 {age}（26歳未満）"}
  - {field: age, op: gte, value: 30, flag: conditional, score: -0.3}   # 就職から年数がたっている人が多い
  - {field: occupation, op: ne, value: employee, flag: unrelated, score: -1.0, reason: "働き方 {occupation}（会社員・公務員ではない）"}
  - {field: prev_health_insurance, op: in, value: [employer, dependent], flag: unrelated, score: -1.0, reason: "就職前の健康保険 {prev_health_insurance}"}
steps:
  - title: 勤務先から保険の資格確認書を受け取る
    detail: 資格確認書か「資格情報のお知らせ」をもらいます。
    where: 勤務先
  - title: 親の国保だったら親に伝える
    detail: 世帯主の親が届け出ることもあります。
    when:
      - {field: age, op: lt, value: 30}
  - title: 役所で国保をやめる届出をする
    detail: 14日以内に届け出ます。郵送やオンラインでできる市区町村もあります。
    details:
      - 窓口の届出書（国民健康保険の資格喪失届など。名前は市区町村で違う）に書きます
      - 郵送できる市区町村なら、届出書と書類のコピーを送ります
    where: 市区町村の役所（国民健康保険の窓口）
    documents: [国保の資格確認書（持っている人）, 勤務先の健康保険の資格確認書か資格情報のお知らせ, マイナンバーが分かるもの]
links:
  - {label: 仙台市 国民健康保険 こんな時こんな手続きを, url: "https://www.city.sendai.jp/kenko-hoken/kurashi/tetsuzuki/kokumin/kenkohoken/konnatoki.html"}
